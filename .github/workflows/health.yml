name: Daily health check
on:
  schedule:
    - cron: "30 11 * * *"
  workflow_dispatch:
jobs:
  health:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Site responds and pre-publish checks pass
        run: |
          URL=$(node -p "require('./src/_data/site.json').url")
          for p in / /archive/ /contact/ /sitemap.xml /feed.xml; do
            code=$(curl -s -o /dev/null -w "%{http_code}" "$URL$p"); echo "$p $code"; [ "$code" = "200" ] || exit 1
          done
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm ci && node scripts/check.js && npm run build
